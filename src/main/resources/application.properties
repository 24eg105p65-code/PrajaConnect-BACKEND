server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:prajaconnect
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Allowed frontend origins (comma separated). Set CORS_ORIGINS on Render to your Vercel URL.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:prajaconnect;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Allowed frontend origins (comma separated). On Render, set CORS_ORIGINS to your Vercel URL.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}
